# T003 [NFR] Local stack: PostgreSQL 16 + the PaperTrail app.
# Credentials can be overridden via a local .env file (git-ignored); see .env.example.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: papertrail
      POSTGRES_USER: ${DB_USERNAME:-papertrail}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-papertrail}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/papertrail
      DB_USERNAME: ${DB_USERNAME:-papertrail}
      DB_PASSWORD: ${DB_PASSWORD:-papertrail}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
